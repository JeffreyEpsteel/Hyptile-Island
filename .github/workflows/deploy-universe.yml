# Deploys the shared universe server (Dockerfile + fly.toml) to Fly.io after every successful game build on main, from
# the same commit, so the game on GitHub Pages and the server always come from one release. The commit goes into the
# image (BUILD_HASH) and /health; the game compares it with its own (__BUILD_HASH__, vite.config.js) and says "the
# universe is updating, try again in a minute" while the two differ (a minute or two per push).
# Needs the repository secret FLY_API_TOKEN; a missing token, app or volume fails the deployment.
# The existing saves stay on the existing Fly volume (SIGTERM writes them before shutdown).
name: Deploy the universe to Fly.io

on:
  workflow_run:
    workflows: [ "Deploy to GitHub Pages" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel a machine update halfway through.
concurrency:
  group: universe-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'JeffreyEpsteel/Hyptile-Island' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      # workflow_run's github.sha belongs to the workflow context, not necessarily the Pages release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify the exact release commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Is Fly set up?
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set: cannot deploy the existing universe"
            exit 1
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: The game's commit
        id: build
        if: steps.gate.outputs.go == 'true'
        run: |
          echo "hash=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "app=hyptile-universe" >> "$GITHUB_OUTPUT"

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.gate.outputs.go == 'true'

      # Deploy only to the existing app and save volume. Never provision replacements.
      - name: The app and its volume exist
        if: steps.gate.outputs.go == 'true'
        run: |
          app="${{ steps.build.outputs.app }}"
          if ! flyctl status --app "$app" >/dev/null 2>&1; then
            echo "::error::Existing Fly app $app is missing or inaccessible; refusing to create a replacement"
            exit 1
          fi
          volumes="$RUNNER_TEMP/hyptile-release-volumes.json"
          flyctl volumes list --app "$app" --json > "$volumes"
          node --input-type=module - "$volumes" <<'NODE'
          import fs from 'node:fs';
          const volumes = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (!Array.isArray(volumes) || !volumes.some(v => v.name === 'universe_data' && v.region === 'fra')) {
            throw new Error('Existing universe_data volume in fra is missing; refusing to provision a replacement');
          }
          NODE

      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: flyctl deploy --app hyptile-universe --config fly.toml --remote-only --build-arg BUILD_HASH=${{ steps.build.outputs.hash }} --wait-timeout 300

      - name: /health serves this commit
        if: steps.gate.outputs.go == 'true'
        run: |
          url="https://${{ steps.build.outputs.app }}.fly.dev/health"
          for i in $(seq 1 20); do
            body="$(curl -fsS --max-time 10 "$url" || true)"
            echo "$body"
            case "$body" in *"\"build\":\"${{ steps.build.outputs.hash }}\""*) exit 0 ;; esac
            sleep 6
          done
          echo "::error::$url does not report build ${{ steps.build.outputs.hash }}"
          exit 1
