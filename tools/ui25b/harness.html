<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>UI harness (wave 25B)</title>
	<style>body { margin: 0; height: 100vh; overflow: hidden; background: linear-gradient(180deg, #6fa7d6 0%, #9cc9e8 45%, #1f8fa3 46%, #0c5f77 100%); }
	#err { position: fixed; left: 0; bottom: 0; z-index: 9999; color: #f88; font: 11px monospace; white-space: pre-wrap; background: #000a; max-width: 100vw; }</style>
</head>
<body>
<pre id="err"></pre>
<script type="module">
// Dev page of wave 25B: the real UI, GameHUD, PanelKit / NavyPanel windows, the markers and the world map's chrome over a flat
// backdrop, one scene per ?scene=: hud | cast | levelup | stand | inv | tavern | navy | toasts | markers | worldmap | menu | menu-online | start
// Capture: node tools/ui25b/capture.mjs (headless Chrome, no game, no WebGPU).
const err = document.getElementById( 'err' );
addEventListener( 'error', ( e ) => { err.textContent += `${ e.message } @ ${ ( e.filename || '' ).split( '/' ).pop() }:${ e.lineno }\n`; } );
addEventListener( 'unhandledrejection', ( e ) => { err.textContent += 'rejected: ' + ( e.reason && e.reason.stack || e.reason ) + '\n'; } );

const q = new URLSearchParams( location.search );
const scene = q.get( 'scene' ) || 'hud';
const { UI } = await import( '/src/ui/UI.js' );
const { GameHUD } = await import( '/src/game/GameHUD.js' );
const { GameState } = await import( '/src/game/GameState.js' );
await import( '/src/ui/ui.css' );
if ( q.get( 'bg' ) === 'beach' ) document.body.style.background = 'linear-gradient(180deg, #78b4df 0%, #b6dcf0 38%, #2d9db0 39%, #197d93 62%, #d9c79a 63%, #bda877 100%)';

const ui = new UI();
globalThis.__ui = ui;
ui.setMode( 'Campaign · Walking' );
const sounds = [];
ui.onSound = ( n ) => sounds.push( n );
globalThis.__sounds = sounds;
// the weather pill is its own feature: the same markup
const { WeatherHUD } = await import( '/src/features/weather/WeatherHUD.js' );
const wx = new WeatherHUD( { ui: { ui } } );
wx.update( { kind: 'breezy', wind: 8, warning: null, manual: false } );

const state = new GameState( null );
state.money = 100000;
state.addFish( 'yellowtail', 1.31, 9 );
state.addFish( 'grunt', 0.84, 9.5 );
state.addFish( 'jack', 4.6, 10 );
state.addFish( 'barracuda', 3.2, 11 );
const game = { state, sellAll() { state.sell(); }, sell( ids ) { state.sell( ids ); }, app: {} };
const hud = new GameHUD( ui, game );
globalThis.__hud = hud;
const frame = ( o ) => hud.update( { fuel: null, sonar: null, fight: null, casting: false, power: 0, bite: false, aiming: true, ...o } );
frame( {} );
ui.togglePanel( false );
await new Promise( ( r ) => setTimeout( r, 50 ) );

if ( q.get( 'touch' ) ) ui.root.classList.add( 'is-touch', 'is-coarse' ); // a phone: the touch HUD layout
if ( scene === 'hud' ) { ui.toast( 'Welcome aboard', 60000 ); }
if ( scene === 'cast' ) { frame( { casting: true, power: Number( q.get( 'p' ) || 0.62 ) } ); }
if ( scene === 'levelup' ) {

	frame( {} ); hud.showLevelUp( 7 );
	// freeze the animation part-way (virtual time in headless Chrome runs it unevenly): ?seek=0.4 s into it
	const seek = Number( q.get( 'seek' ) || 0.45 );
	const st = document.createElement( 'style' );
	st.textContent = `.gm-level.is-on .gm-level-card { animation-delay: -${ seek + 0.25 }s !important; animation-play-state: paused !important; } .gm-level.is-on .gm-level-ring { animation-delay: -${ seek }s !important; animation-play-state: paused !important; } .gm-level.is-on .gm-level-ring + .gm-level-ring { animation-delay: -${ seek - 0.14 }s !important; }`;
	document.head.append( st );

}
if ( scene === 'stand' ) hud.openStand( { name: 'PoorGoat · Fish buyer', greeting: 'Let\'s see what you caught. Fair prices, cash.' } );
if ( scene === 'shop' ) { hud.openStand( { kind: 'shop', name: 'Ethena Prosper · Chandlery', greeting: 'Line, reels, a bigger hold, diesel. What do you need?' } ); }
if ( scene === 'inv' ) hud.toggleInventory( true );
if ( scene === 'tavern' ) {

	const { TavernPanel } = await import( '/src/features/harbour/TavernPanel.js' );
	const harbour = { app: { ui: { ui } }, hour: 19.5, time: 0, features: { state }, residentName: () => 'Mara', tavern: { buffs: [], left: () => 0, heard: [], dice: { lastRound: null, tally: { rounds: 0, wins: 0, losses: 0, draws: 0 }, ready: () => true } } };
	const p = new TavernPanel( harbour );
	p.show( { name: 'The Salted Gull', keeper: 'x', port: 'home' }, q.get( 'tab' ) || 'menu' );
	globalThis.__panel = p;

}

if ( scene === 'navy' ) {

	const { NavyPanel } = await import( '/src/features/navy/NavyPanel.js' );
	const navy = { app: { ui: { ui } }, press: null,
		view: () => ( { standingName: 'Respected', standing: 34, wanted: false, forecast: 'A squall line is 2 hours west of Tidemark.', owed: 450, owedCount: 3, fineOwed: 120 } ),
		chandlerRows: () => [ { id: 'cannon', label: 'Better cannon', price: 900, ok: true, note: 'Long nines for a respected captain' }, { id: 'chain', label: 'Chain shot x10', price: 210, ok: false, note: 'Standing 50 needed' } ] };
	const p = new NavyPanel( navy );
	p.open( q.get( 'mode' ) || 'office' );

}

if ( scene === 'combo' ) {

	// wave 27: everything at once, as in play (A-CLASS 2.1): a long mode pill, the boat's purse gauges, a toast, the fight panel and a prompt
	ui.setMode( q.get( 'mode' ) || 'Seaplane · airborne · chase view' );
	frame( { fuel: { litres: 31, tank: 40 }, sonar: { depth: 12, fish: [ 0.3, 0.6 ] }, stamina: 0.7, fight: { tension: 0.5, band: [ 0.4, 0.7 ], stamina: 0.6, distance: 1.4, surge: 0.8 } } );
	ui.setPrompt( 'E', q.get( 'prompt' ) || 'Take the helm · V camera · Leave helm' );
	ui.toast( 'Sold 4 fish for $184 at the fish market in town', 60000 );

}

if ( scene === 'toasts' ) {

	// the queue: five arrive at once, two show
	for ( const t of [ 'Caught a yellowtail · 1.31 kg', 'Level 7 reached', 'Sold 4 fish for $184', 'The coach on the pier sells ropes', 'A squall line is coming' ] ) ui.toast( t, 60000 );

}

if ( scene === 'markers' ) {

	const { ensureMapCSS } = await import( '/src/game/Minimap.js' );
	const { MARKER_ICONS: ICON } = await import( '/src/ui/icons.js' ); // (Minimap.js's ICON is this set once tools/ui25b/apply-patches.mjs has run)
	ensureMapCSS();
	const wrap = document.createElement( 'div' );
	wrap.className = 'tw-root';
	wrap.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;pointer-events:none';
	const kinds = [ 'joe', 'marta', 'pons', 'boat', 'yard', 'wp', 'death', 'wreck', 'pin', 'airstrip', 'parked', 'quest', 'isle', 'plane', 'trade', 'board', 'camp', 'pirate', 'bounty', 'peer' ];
	const icons = { joe: 'fish', marta: 'anchor', pons: 'fish', boat: 'boat', yard: 'anchor', wp: 'flag', death: 'skull', wreck: 'wreck', pin: 'flag', airstrip: 'plane', parked: 'plane', quest: 'quest', isle: 'skull', plane: 'plane', trade: 'crate', board: 'board', camp: 'swords', pirate: 'skull', bounty: 'target', peer: 'boat' };
	const mini = document.createElement( 'div' );
	mini.className = 'gm-map';
	mini.style.cssText = 'position:relative;right:auto;bottom:auto;width:440px;height:440px;transform:scale(1.5);background:#0b2c48;border-radius:50%';
	const marks = document.createElement( 'div' );
	marks.className = 'gm-map-marks';
	kinds.forEach( ( k, i ) => {

		const a = i / kinds.length * Math.PI * 2, r = 150 + ( i % 2 ) * 40;
		const e = document.createElement( 'div' );
		e.className = 'gm-mk is-' + k;
		e.style.transform = `translate(${ 220 + Math.cos( a ) * r }px, ${ 220 + Math.sin( a ) * r }px)`;
		e.innerHTML = `<b></b><i>${ ICON[ icons[ k ] ] }</i><em>${ k }</em>`;
		marks.append( e );

	} );
	mini.append( marks );
	wrap.append( mini );
	document.body.append( wrap );

}

if ( scene === 'worldmap' ) {

	const { WorldMap } = await import( '/src/ui/WorldMap.js' );
	const feature = { bounds: { minX: -700, maxX: 700, minZ: -900, maxZ: 500 }, markers: new Map(), clearTrackedQuest() {} };
	const app = { terrainData: null, features: { get: () => null } };
	const wm = new WorldMap( ui.hud, app, feature );
	wm.el.classList.add( 'is-on', 'is-shown', 'is-legend' );
	wm.viewEl.style.background = '#0b2c48';
	// the legend's chips with the real icon set
	const { MARKER_ICONS: ICON } = await import( '/src/ui/icons.js' );
	const rows = [ [ 'joe', 'fish', 'Fish buyer' ], [ 'marta', 'anchor', 'Chandlery' ], [ 'boat', 'boat', 'Your boat' ], [ 'airstrip', 'plane', 'Airstrip' ], [ 'quest', 'quest', 'Quest' ], [ 'pirate', 'skull', 'Pirates' ], [ 'wreck', 'wreck', 'Wreck' ], [ 'wp', 'flag', 'Waypoint' ] ];
	wm.legendEl.innerHTML = rows.map( ( [ k, i, t ] ) => `<span class="wm-lg"><i class="is-${ k }">${ ICON[ i ] }</i>${ t }</span>` ).join( '' );
	wm.targetEl.hidden = false;
	wm.targetEl.querySelector( 'b' ).textContent = 'Deliver the crates to Tidemark';
	wm.targetEl.querySelector( 'span' ).textContent = '1.2 km · bearing 042°';
	// markers on the chart
	const marks = wm.el.querySelector( '.wm-marks' );
	[ [ 'joe', 'fish', 300, 300 ], [ 'marta', 'anchor', 420, 340 ], [ 'boat', 'boat', 520, 420 ], [ 'quest', 'quest', 640, 300 ], [ 'pirate', 'skull', 760, 460 ], [ 'wreck', 'wreck', 840, 330 ] ].forEach( ( [ k, i, x, y ] ) => {

		const e = document.createElement( 'div' );
		e.className = 'gm-mk is-' + k;
		e.style.transform = `translate(${ x }px, ${ y }px)`;
		e.innerHTML = `<b></b><i>${ ICON[ i ] }</i><em>${ k }</em>`;
		marks.append( e );

	} );

}

if ( scene === 'menu' || scene === 'menu-online' ) {

	const { MainMenu } = await import( '/src/ui/MainMenu.js' );
	const app = { rules: { mode: 'campaign' }, pendingServer: null, universe: null, game: null, serverUrl: () => '', features: { get: () => null } };
	const menu = new MainMenu( { ui, app } );
	globalThis.__menu = menu;
	// the shared universe answers /health: the same line the player sees (a stand-in server, no network)
	globalThis.fetch = async () => ( { ok: true, json: async () => ( { ok: true, build: null, version: 1, universe: { name: 'Hyptile', players: 3, cap: 16, captains: 41, day: 12 } } ) } );
	if ( scene === 'menu-online' ) menu.show( { mode: 'multiplayer', step: 'slots' } );
	else menu.show( {} );
	if ( q.get( 'adv' ) ) menu.el.querySelector( '.mm-adv' ).open = q.get( 'adv' ) === '1';

}

if ( scene === 'start' ) {

	ui.startEl.hidden = false;
	ui.startEl.classList.add( 'is-on' );

}

if ( q.get( 'panel' ) === '1' ) { ui.togglePanel( true ); }
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
